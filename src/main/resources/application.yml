server:
  port: 8080

spring:
  application:
    name: merchantops-agent
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:merchantops}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  sql:
    init:
      # 每次启动执行 schema/data 脚本（幂等：IF NOT EXISTS + INSERT IGNORE）
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# Actuator：健康检查默认探测数据源（db indicator）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ===== LLM 配置（OpenAI-compatible API，默认 DeepSeek）=====
merchantops:
  llm:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    # DeepSeek V4 Flash（如控制台显示的模型 ID 不同，用 DEEPSEEK_MODEL 环境变量覆盖）
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    temperature: 0.3
    max-tokens: 2048
    # Agent Loop 限制
    max-steps: 10
    request-timeout-ms: 60000

logging:
  level:
    com.merchantops: debug
