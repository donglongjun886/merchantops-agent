<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MerchantOps Agent</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f0f2f5; height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff; padding: 16px 24px; display: flex; align-items: baseline; gap: 12px;
    }
    header h1 { font-size: 20px; font-weight: 600; }
    header span { font-size: 13px; opacity: .85; }
    main {
      flex: 1; overflow-y: auto; padding: 20px 24px; display: flex;
      flex-direction: column; gap: 12px; max-width: 860px; width: 100%; margin: 0 auto;
    }
    .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; font-size: 14px; }
    .msg.user { align-self: flex-end; background: #4f46e5; color: #fff; white-space: pre-wrap; }
    .msg.assistant { align-self: flex-start; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .msg.assistant table { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
    .msg.assistant th, .msg.assistant td { border: 1px solid #e5e7eb; padding: 4px 10px; text-align: left; }
    .msg.assistant th { background: #f9fafb; }
    .msg.assistant code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
    .msg.assistant pre { background: #1f2937; color: #f9fafb; padding: 10px; border-radius: 8px; overflow-x: auto; }
    .msg.assistant h1, .msg.assistant h2, .msg.assistant h3 { font-size: 15px; margin: 8px 0 4px; }
    footer { border-top: 1px solid #e5e7eb; background: #fff; padding: 12px 24px; }
    .suggestions { display: flex; gap: 8px; flex-wrap: wrap; max-width: 860px; margin: 0 auto 10px; }
    .suggestions button {
      border: 1px solid #d1d5db; background: #f9fafb; color: #374151;
      padding: 5px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
    }
    .suggestions button:hover { border-color: #4f46e5; color: #4f46e5; }
    form { display: flex; gap: 10px; max-width: 860px; margin: 0 auto; }
    input {
      flex: 1; padding: 11px 14px; border: 1px solid #d1d5db; border-radius: 10px;
      font-size: 14px; outline: none;
    }
    input:focus { border-color: #4f46e5; }
    button[type="submit"] {
      background: #4f46e5; color: #fff; border: none; padding: 0 22px;
      border-radius: 10px; font-size: 14px; cursor: pointer;
    }
    button[type="submit"]:hover { background: #4338ca; }
    button[type="submit"]:disabled { opacity: .6; cursor: not-allowed; }
    .typing { color: #9ca3af; }
  </style>
</head>
<body>
  <header>
    <h1>MerchantOps Agent</h1>
    <span>自然语言查询商家经营数据</span>
  </header>

  <main id="chat"></main>

  <footer>
    <div class="suggestions">
      <button data-q="查询商家 1 的基本信息">查商家信息</button>
      <button data-q="分析商家 1 的 GMV 任务完成度">GMV 完成度</button>
      <button data-q="查询订单 XD20250801001 的信息">查订单</button>
    </div>
    <form id="chat-form">
      <input id="input" placeholder="输入问题，如：商家 1 有哪些任务，完成度如何？" autocomplete="off">
      <button type="submit" id="send">发送</button>
    </form>
  </footer>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function addMessage(role, html) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.innerHTML = html;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function send(text) {
      if (!text.trim() || sendBtn.disabled) return;
      addMessage('user', escapeHtml(text));
      input.value = '';
      sendBtn.disabled = true;
      const loading = addMessage('assistant', '<span class="typing">思考中…</span>');
      try {
        const res = await fetch('/api/agent/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        loading.innerHTML = marked.parse(data.answer);
      } catch (err) {
        loading.innerHTML = '请求失败：' + escapeHtml(String(err));
      }
      sendBtn.disabled = false;
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener('submit', (e) => { e.preventDefault(); send(input.value); });
    document.querySelectorAll('.suggestions button').forEach((btn) => {
      btn.addEventListener('click', () => send(btn.dataset.q));
    });
  </script>
</body>
</html>
