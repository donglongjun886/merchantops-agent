[project]
name = "merchantops-agent"
version = "0.1.0"
description = "MerchantOps Agent - LLM + Tool Calling 企业业务 Agent 实践"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "pydantic-settings>=2.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "sqlalchemy>=2.0",
    "pymysql",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# 真实 API 集成测试默认不跑（消耗费用），显式 -m integration 才执行
markers = [
    "integration: 真实 DeepSeek API 集成测试（需 DEEPSEEK_API_KEY，默认跳过）",
]
addopts = "-m 'not integration'"
